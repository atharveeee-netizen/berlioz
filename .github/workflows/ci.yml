name: Berlioz Quantum Compilation CI

on:
  push:
    branches: [ master, main, ml16, ml19, ml20 ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy
        # Note: kickmix is used for specialized circuit generation if installed

    - name: Run Test Suite (excluding kickmix-dependent validator if kickmix not in pypi)
      run: |
        python -m pytest tests/test_berlioz_v2_compiler.py tests/test_arithmetic_tensor.py tests/test_pricebook.py -v
